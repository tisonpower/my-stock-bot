name: Send Stock Price Only

on:
  schedule:
    # 한국장 마감(15:40) -> UTC 06:40 / 미국장 마감(06:40) -> UTC 21:40
    - cron: '40 6,21 * * 1-5' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        # 💡 전 세계 금융 데이터를 가져오기 위해 yfinance를 추가했습니다!
        run: |
          pip install telethon requests yfinance

      - name: Run price script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python price.py
